<text x="40.0" y="106.0" font-family="Noto Serif, DejaVu Serif, serif" font-size="36" font-weight="bold" font-style="normal" fill="#1b1f1c" text-anchor="start" >On paper the gap is small. In person it almost vanishes.</text>
<text x="40.0" y="140.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#5b6159" text-anchor="start" >Women say earnings matter a bit more. Face to face, earnings barely predict attraction for anyone.</text>
<rect x="40.0" y="176.0" width="545.0" height="470.0" rx="16" fill="#f0ede4" />
<text x="68.0" y="222.0" font-family="Noto Serif, DejaVu Serif, serif" font-size="24" font-weight="bold" font-style="normal" fill="#1b1f1c" text-anchor="start" >1  What people say</text>
