<text x="68.0" y="274.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5b6159" text-anchor="start" >Walter et al. (2020)</text>
<text x="80.0" y="330.0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="19" font-weight="bold" font-style="normal" fill="#1b1f1c" text-anchor="start" >Good financial prospects</text>
