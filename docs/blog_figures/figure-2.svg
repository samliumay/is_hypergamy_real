<text x="715.2" y="144" font-family="Noto Serif, DejaVu Serif, serif" font-size="19" fill="#444">Women overtake men in education</text>
<text x="159.8" y="185.5" font-family="Noto Serif, DejaVu Serif, serif" font-size="21" font-weight="bold" fill="#2b5c8a">He has more education (“she married up”)</text>
<text x="159.8" y="512.9" font-family="Noto Serif, DejaVu Serif, serif" font-size="21" font-weight="bold" fill="#c07d10">She has more education (“she married down”)</text>
<text x="130" y="596" font-family="Noto Serif, DejaVu Serif, serif" font-size="19" fill="#444">Then (mid 20th century)</text>
<text x="1120" y="596" font-family="Noto Serif, DejaVu Serif, serif" font-size="19" fill="#444" text-anchor="end">Now (2010s)</text>
<text x="110" y="340.0" font-family="Noto Serif, DejaVu Serif, serif" font-size="19" fill="#444" text-anchor="middle" transform="rotate(-90 110 340.0)">Share of couples with an education gap</text>
<text x="40" y="650" font-family="Noto Serif, DejaVu Serif, serif" font-size="18" fill="#555">Same wish for a similar partner, new supply: once more women hold degrees, “down” becomes common.</text>
